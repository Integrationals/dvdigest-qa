<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste test</title><style>body{font-family:Arial,sans-serif;max-width:640px;margin:24px auto;padding:0 16px}label{display:block;margin:14px 0 4px;font-weight:700}input{width:100%;padding:10px;font-size:16px;box-sizing:border-box}#log{margin-top:20px;background:#f4f4f4;padding:10px;font:13px monospace;white-space:pre-wrap;min-height:120px}</style></head><body>
<h1>Paste test</h1><p>Paste into each field, with Ctrl+V and with right-click, Paste. The log shows what the browser reports.</p>
<label>A · password</label><input id="a" type="password">
<label>B · password, autocomplete off</label><input id="b" type="password" autocomplete="off">
<label>C · password, new-password</label><input id="c" type="password" autocomplete="new-password">
<label>D · text</label><input id="d" type="text" autocomplete="off">
<div id="log">Events appear here.</div>
<script>
var log=document.getElementById('log');function w(t){log.textContent=(log.textContent==='Events appear here.'?'':log.textContent)+t+'\n';}
document.querySelectorAll('input').forEach(function(f){
 f.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey)w(f.id+': keydown '+(e.ctrlKey?'Ctrl+':'')+(e.metaKey?'Cmd+':'')+e.key);});
 f.addEventListener('paste',function(e){var t=(e.clipboardData&&e.clipboardData.getData('text'))||'';w(f.id+': paste event, clipboard holds '+t.length+' characters'+(e.defaultPrevented?', blocked':''));});
 f.addEventListener('input',function(e){w(f.id+': input ('+e.inputType+'), field now '+f.value.length+' characters');});
});
w('Browser: '+navigator.userAgent);
</script></body></html>
